<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Outorga TV">
  <!--
    O tracinho ambar da marca sobre a linha do horizonte, que e a mesma
    figura do cabecalho e da paleta: fundo escuro com um pouco de azul, luz
    ambar cortando, e o horizonte separando as secoes.

    Sem letra: a dezesseis pixels a inicial vira sujeira. O fundo e solido de
    proposito, porque a aba do navegador pode ser clara ou escura e quem
    garante o contraste tem que ser o icone.
  -->
  <rect width="32" height="32" rx="7" fill="#0d0f14"/>
  <!-- O tracinho da marca, o mesmo que abre "— CINE SERRA" no cabecalho. -->
  <rect x="6" y="10" width="11" height="2.5" rx="1.25" fill="#e6b800"/>
  <!-- A tela, que e o que o produto entrega. -->
  <rect x="6" y="16" width="20" height="10" rx="2" fill="none" stroke="#e6b800" stroke-width="2"/>
  <!-- O horizonte, cortando a tela: e a linha que separa as secoes no site. -->
  <rect x="8.5" y="21.5" width="15" height="1.5" rx="0.75" fill="#e6b800" opacity="0.55"/>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo no mesmo branch cancela a execucao anterior. Sem isso, uma
# sequencia de commits enfileira builds que ja nasceram desatualizados.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes e cobertura
        run: mvn -B verify

      - name: Guardar o relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: Conferir a imagem Docker
        run: docker build -t mirante-api:ci .

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Conferir os tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

  seguranca:
    name: Seguranca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Sem chave da NVD a consulta e limitada e cai com frequencia por
      # tempo esgotado, o que quebraria o build por motivo que nao e nosso.
      # Roda mesmo assim, para o relatorio existir, mas nao trava a entrega.
      # Cadastre NVD_API_KEY nos secrets e troque para false quando quiser
      # que vulnerabilidade alta pare o build.
      - name: Dependencias do backend
        working-directory: backend
        continue-on-error: true
        run: >
          mvn -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Dependencias da web
        working-directory: web
        run: npm audit --audit-level=high
